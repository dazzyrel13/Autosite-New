<div class="container" style="margin-top: -80px; position: relative; z-index: 100;">
    <div class="glass p-4 p-md-5 rounded-5 shadow-lg" data-aos="fade-up">
        <h2 class="h4 fw-bold text-white mb-4">
            <i class="bi bi-search text-accent me-2"></i> Расширенный поиск
        </h2>

        <form action="{{ url_for('search') }}" method="GET" class="row g-3">
            <!-- Brand & Model -->
            <div class="col-md-3">
                <label class="form-label text-white-50 small">Марка</label>
                <select name="brand"
                    class="form-select bg-dark border-secondary border-opacity-25 text-white rounded-3 py-2">
                    <option value="">Все марки</option>
                    {% for b in brands %}
                    <option value="{{ b }}">{{ b }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label text-white-50 small">Модель</label>
                <input type="text" name="model"
                    class="form-control bg-dark border-secondary border-opacity-25 text-white rounded-3 py-2"
                    placeholder="Название модели">
            </div>

            <!-- Year Range -->
            <div class="col-md-3">
                <label class="form-label text-white-50 small">Год от</label>
                <input type="number" name="year_from"
                    class="form-control bg-dark border-secondary border-opacity-25 text-white rounded-3 py-2"
                    placeholder="2015">
            </div>
            <div class="col-md-3">
                <label class="form-label text-white-50 small">Год до</label>
                <input type="number" name="year_to"
                    class="form-control bg-dark border-secondary border-opacity-25 text-white rounded-3 py-2"
                    placeholder="2024">
            </div>

            <!-- Price & Engine -->
            <div class="col-md-3">
                <label class="form-label text-white-50 small">Цена до (₽)</label>
                <input type="number" name="price_to"
                    class="form-control bg-dark border-secondary border-opacity-25 text-white rounded-3 py-2"
                    placeholder="5 000 000">
            </div>

            <div class="col-md-3">
                <label class="form-label text-white-50 small">Объем двигателя от</label>
                <input type="number" step="0.1" name="engine_from"
                    class="form-control bg-dark border-secondary border-opacity-25 text-white rounded-3 py-2"
                    placeholder="1.5">
            </div>

            <div class="col-md-3">
                <label class="form-label text-white-50 small">Пробег до (км)</label>
                <input type="number" name="mileage_to"
                    class="form-control bg-dark border-secondary border-opacity-25 text-white rounded-3 py-2"
                    placeholder="50 000">
            </div>

            <div class="col-md-3">
                <label class="form-label text-white-50 small">Тип кузова</label>
                <select name="body_type"
                    class="form-select bg-dark border-secondary border-opacity-25 text-white rounded-3 py-2">
                    <option value="">Любой</option>
                    <option value="sedan">Седан</option>
                    <option value="suv">Внедорожник</option>
                    <option value="hatchback">Хэтчбек</option>
                    <option value="minivan">Минивэн</option>
                    <option value="truck">Грузовик</option>
                </select>
            </div>

            <div class="col-12 mt-4">
                <div class="d-flex align-items-center justify-content-between">
                    <div class="form-check">
                        <input class="form-check-input bg-dark border-accent" type="checkbox" name="is_new"
                            id="checkNew">
                        <label class="form-check-label text-white small" for="checkNew">
                            Только новые (без пробега)
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary-custom px-5 py-2 rounded-pill">
                        Найти предложения <i class="bi bi-chevron-right ms-2"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
