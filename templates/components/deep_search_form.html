<div class="container" style="position: relative; z-index: 100;">
    <div class="deep-search-card" data-aos="fade-up">
        <div class="d-flex align-items-center mb-5">
            <div class="contact-icon-box me-4" style="width: 60px; height: 60px;">
                <i class="bi bi-search fs-4"></i>
            </div>
            <div>
                <h2 class="h3 fw-bold text-white mb-1">Расширенный поиск</h2>
                <p class="text-white opacity-50 mb-0 small text-uppercase fw-bold" style="letter-spacing: 2px;">Найдите технику своей мечты</p>
            </div>
        </div>

        <form action="{{ url_for('search') }}" method="GET" class="row g-4">
            <!-- Brand & Model -->
            <div class="col-md-3">
                <label class="form-label text-white-50 small fw-bold text-uppercase mb-2" style="letter-spacing: 1px;">Марка</label>
                <select name="brand" class="form-select form-control">
                    <option value="">Все марки</option>
                    {% for b in brands %}
                    <option value="{{ b }}">{{ b }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label text-white-50 small fw-bold text-uppercase mb-2" style="letter-spacing: 1px;">Модель</label>
                <input type="text" name="model" class="form-control" placeholder="Название модели">
            </div>

            <!-- Year Range -->
            <div class="col-md-3">
                <label class="form-label text-white-50 small fw-bold text-uppercase mb-2" style="letter-spacing: 1px;">Год от</label>
                <input type="number" name="year_from" class="form-control" placeholder="2015">
            </div>
            <div class="col-md-3">
                <label class="form-label text-white-50 small fw-bold text-uppercase mb-2" style="letter-spacing: 1px;">Год до</label>
                <input type="number" name="year_to" class="form-control" placeholder="2024">
            </div>

            <!-- Price & Engine -->
            <div class="col-md-3">
                <label class="form-label text-white-50 small fw-bold text-uppercase mb-2" style="letter-spacing: 1px;">Цена до (₽)</label>
                <input type="number" name="price_to" class="form-control" placeholder="5 000 000">
            </div>

            <div class="col-md-3">
                <label class="form-label text-white-50 small fw-bold text-uppercase mb-2" style="letter-spacing: 1px;">Двигатель от (л)</label>
                <input type="number" step="0.1" name="engine_from" class="form-control" placeholder="1.5">
            </div>

            <div class="col-md-3">
                <label class="form-label text-white-50 small fw-bold text-uppercase mb-2" style="letter-spacing: 1px;">Пробег до (км)</label>
                <input type="number" name="mileage_to" class="form-control" placeholder="50 000">
            </div>

            <div class="col-md-3">
                <label class="form-label text-white-50 small fw-bold text-uppercase mb-2" style="letter-spacing: 1px;">Тип кузова</label>
                <select name="body_type" class="form-select form-control">
                    <option value="">Любой тип</option>
                    <option value="sedan">Седан</option>
                    <option value="suv">Внедорожник</option>
                    <option value="hatchback">Хэтчбек</option>
                    <option value="minivan">Минивэн</option>
                    <option value="truck">Грузовик</option>
                </select>
            </div>

            <div class="col-12 mt-5">
                <div class="d-flex align-items-center justify-content-between flex-wrap gap-4">
                    <div class="form-check custom-checkbox">
                        <input class="form-check-input" type="checkbox" name="is_new" id="checkNew">
                        <label class="form-check-label text-white-75" for="checkNew">
                            Только новые автомобили
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary-custom px-5 py-3 rounded-4 shadow-lg accent-pulse-btn">
                        Найти предложения <i class="bi bi-chevron-right ms-2 fs-5"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
