version: '3.8'

services:
  # 🚗 Основной сервис приложения (Gunicorn + Flask)
  web:
    build: .
    container_name: turbo_dv_web
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://user:password@db:5432/autosite
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your_fallback_secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - turbo_net

  # 🐘 База данных PostgreSQL (Надежная работа с данными)
  db:
    image: postgres:15-alpine
    container_name: turbo_dv_db
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=autosite
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d autosite"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - turbo_net

  # ⚡ Redis для кэширования и синхронизации курсов валют
  redis:
    image: redis:7-alpine
    container_name: turbo_dv_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - turbo_net

# Локальные хранилища данных
volumes:
  postgres_data:

# Изолированная внутренняя сеть
networks:
  turbo_net:
    driver: bridge
